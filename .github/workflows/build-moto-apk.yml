name: Build Moto Headunit APK

on:
  workflow_dispatch:
  push:
    branches: [ "moto-j2prime" ]

permissions:
  contents: read

concurrency:
  group: moto-headunit-j2prime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build J2 Prime motorcycle APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply J2 Prime motorcycle preset
        run: python3 moto/apply_moto_patch.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build Moto Headunit debug APK
        run: ./gradlew :app:assembleGithubDebug --no-daemon --stacktrace

      - name: Upload Moto APK
        uses: actions/upload-artifact@v4
        with:
          name: Moto-Headunit-J2Prime-APK
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
