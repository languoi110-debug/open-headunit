name: AppleJr DNS Android Build

on:
  push:
    branches:
      - chatgpt/applejr-dns-android
    paths:
      - 'applejr_dns_android/**'
      - '.github/workflows/applejr-dns-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests and APK build
        working-directory: applejr_dns_android
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp applejr_dns_android/app/build/outputs/apk/debug/app-debug.apk AppleJr_DNS_Android_v1.0.0.apk
          sha256sum AppleJr_DNS_Android_v1.0.0.apk > AppleJr_DNS_Android_v1.0.0.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppleJr-DNS-Android-v1.0.0
          path: |
            AppleJr_DNS_Android_v1.0.0.apk
            AppleJr_DNS_Android_v1.0.0.sha256
            applejr_dns_android/README.md
          if-no-files-found: error
          retention-days: 7
